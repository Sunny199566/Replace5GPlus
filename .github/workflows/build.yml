name: Build Tweak
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git curl perl make clang lld binutils unzip

      - name: Clone Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Install iOS 16.5 SDK
        run: $THEOS/bin/install-sdk 16.5

      - name: Build deb package
        run: make package

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          path: packages/*.deb