 name: Build Tweak
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: theos/theos-action@main
        with:
          platform: iphoneos
      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          path: packages/*.deb
